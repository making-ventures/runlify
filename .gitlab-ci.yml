image: node:22

stages:
  - test
  - release

cache:
  paths:
    - node_modules/

before_script:
  - yarn install

test:
  stage: test
  script:
    - yarn lint
    - yarn build
    - yarn test

release:
  stage: release
  # Аутентификация через OIDC Trusted Publisher
  # npm автоматически использует OIDC токен для публикации через настроенный Trusted Publisher
  # Не требует токенов и работает полностью автоматически
  id_tokens:
    NPM_OIDC_TOKEN:
      aud: https://registry.npmjs.org
  script:
    - git config --global user.email "ci@example.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin https://${CI_DEPLOY_USER}:${CI_DEPLOY_PASSWORD}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - git checkout $CI_COMMIT_REF_NAME
    # Аутентификация через OIDC Trusted Publisher
    # npm для trusted publishing использует OIDC токен через переменную NPM_TOKEN
    - |
      if [ -z "$NPM_OIDC_TOKEN" ]; then
        echo "❌ OIDC токен не найден. Убедитесь, что Trusted Publisher настроен в npm"
        exit 1
      fi
      echo "🔐 Используется OIDC Trusted Publisher для аутентификации"
      echo "📦 Версия npm: $(npm --version)"
      # npm для trusted publishing ожидает OIDC токен в переменной NPM_TOKEN
      # npm версии 11.5.1+ автоматически использует OIDC токен при наличии Trusted Publisher
      export NPM_TOKEN="$NPM_OIDC_TOKEN"
      export NPM_CONFIG_REGISTRY=https://registry.npmjs.org
      # Создаем .npmrc с OIDC токеном для trusted publishing
      echo "//registry.npmjs.org/:_authToken=${NPM_OIDC_TOKEN}" > ~/.npmrc
      echo "✅ OIDC токен настроен для Trusted Publisher"
    - chmod +x ./newVersion.sh
    - ./newVersion.sh
  when: manual
  only:
    - main
  after_script:
    - >
      if [ $CI_JOB_STATUS != 'success' ]; then
        sh ci-notify.sh "🆘 $CI_JOB_NAME failed"
      else
        sh ci-notify.sh "✅ $CI_JOB_NAME success"
      fi