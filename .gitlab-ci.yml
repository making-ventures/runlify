image: node:22

stages:
  - test
  - release

cache:
  paths:
    - node_modules/

before_script:
  - yarn install

test:
  stage: test
  script:
    - yarn lint
    - yarn build
    - yarn test

release:
  stage: release
  # Аутентификация через OIDC Trusted Publisher
  # npm автоматически использует OIDC токен для публикации через настроенный Trusted Publisher
  # Не требует токенов и работает полностью автоматически
  id_tokens:
    NPM_OIDC_TOKEN:
      aud: https://registry.npmjs.org
  script:
    - git config --global user.email "ci@example.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin https://${CI_DEPLOY_USER}:${CI_DEPLOY_PASSWORD}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - git checkout $CI_COMMIT_REF_NAME
    # Аутентификация через OIDC Trusted Publisher
    # npm автоматически использует OIDC токен при наличии настроенного Trusted Publisher
    # npm версии 11.5.1+ автоматически обнаруживает и использует OIDC токен
    - |
      echo "🔐 Используется OIDC Trusted Publisher для аутентификации"
      echo "📦 Версия npm: $(npm --version)"
      echo "📦 Версия node: $(node --version)"
      
      # npm автоматически использует OIDC токен из переменной NPM_OIDC_TOKEN
      # при наличии настроенного Trusted Publisher в настройках пакета
      export NPM_CONFIG_REGISTRY=https://registry.npmjs.org
      
      echo "✅ Конфигурация для Trusted Publisher готова"
      echo "ℹ️  npm автоматически использует OIDC токен при публикации"
    - chmod +x ./newVersion.sh
    - ./newVersion.sh
  when: manual
  only:
    - main
  after_script:
    - >
      if [ $CI_JOB_STATUS != 'success' ]; then
        sh ci-notify.sh "🆘 $CI_JOB_NAME failed"
      else
        sh ci-notify.sh "✅ $CI_JOB_NAME success"
      fi