image: node:22

stages:
  - test
  - release

cache:
  paths:
    - node_modules/

before_script:
  - yarn install

test:
  stage: test
  script:
    - yarn lint
    - yarn build
    - yarn test

release:
  stage: release
  # Аутентификация через OIDC Trusted Publisher
  # npm автоматически использует OIDC токен для публикации через настроенный Trusted Publisher
  # Не требует токенов и работает полностью автоматически
  id_tokens:
    NPM_OIDC_TOKEN:
      aud: https://registry.npmjs.org
  script:
    - git config --global user.email "ci@example.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin https://${CI_DEPLOY_USER}:${CI_DEPLOY_PASSWORD}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - git checkout $CI_COMMIT_REF_NAME
    # Аутентификация через OIDC Trusted Publisher
    # npm для trusted publishing использует OIDC токен через переменную NPM_TOKEN
    - |
      if [ -z "$NPM_OIDC_TOKEN" ]; then
        echo "❌ OIDC токен не найден. Убедитесь, что Trusted Publisher настроен в npm"
        exit 1
      fi
      echo "🔐 Используется OIDC Trusted Publisher для аутентификации"
      echo "📦 Версия npm: $(npm --version)"
      echo "📦 Версия node: $(node --version)"
      
      # npm для trusted publishing ожидает OIDC токен в переменной NPM_TOKEN
      # npm версии 11.5.1+ автоматически использует OIDC токен при наличии Trusted Publisher
      # Согласно документации npm, для trusted publishing нужно использовать переменную NPM_TOKEN
      export NPM_TOKEN="$NPM_OIDC_TOKEN"
      export NPM_CONFIG_REGISTRY=https://registry.npmjs.org
      
      # Проверяем минимальную версию npm (11.5.1+ для OIDC поддержки)
      npm_version=$(npm --version)
      echo "ℹ️  Полная версия npm: $npm_version"
      
      # npm для trusted publishing использует переменную окружения NPM_TOKEN
      # Создаем .npmrc с OIDC токеном (npm читает токен из переменной или .npmrc)
      mkdir -p ~/.npm
      echo "//registry.npmjs.org/:_authToken=${NPM_OIDC_TOKEN}" > ~/.npmrc
      echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
      
      # Дополнительная проверка: убеждаемся, что токен не пустой
      if [ -z "$NPM_OIDC_TOKEN" ]; then
        echo "❌ Ошибка: OIDC токен пустой!"
        exit 1
      fi
      
      echo "✅ OIDC токен настроен для Trusted Publisher"
      echo "ℹ️  NPM_TOKEN установлен: ${NPM_TOKEN:0:20}... (первые 20 символов)"
      echo "ℹ️  Проверка .npmrc (токен скрыт):"
      cat ~/.npmrc | sed 's/\(authToken=\).*/\1***скрыто***/'
      
      # Важно: npm для trusted publishing должен автоматически обнаружить OIDC токен
      # при наличии настроенного Trusted Publisher в настройках пакета
    - chmod +x ./newVersion.sh
    - ./newVersion.sh
  when: manual
  only:
    - main
  after_script:
    - >
      if [ $CI_JOB_STATUS != 'success' ]; then
        sh ci-notify.sh "🆘 $CI_JOB_NAME failed"
      else
        sh ci-notify.sh "✅ $CI_JOB_NAME success"
      fi