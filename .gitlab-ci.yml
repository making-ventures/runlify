# DEPRECATED: GitLab CI is kept only as a legacy fallback during the GitHub
# migration. Use GitHub Actions workflows in .github/workflows/ for new CI/CD.

image: node:22

stages:
  - test
  - release

cache:
  paths:
    - node_modules/

before_script:
  - yarn install

test:
  stage: test
  script:
    - yarn lint
    - yarn build
    - yarn test

release:
  stage: release
  # Аутентификация: OIDC Trusted Publisher (приоритет) или granular access token (fallback)
  # Если настроен OIDC Trusted Publisher - используется автоматически
  # Если нет - используется переменная NPM_TOKEN (granular access token)
  id_tokens:
    NPM_OIDC_TOKEN:
      aud: https://registry.npmjs.org
  script:
    - git config --global user.email "ci@example.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin https://${CI_DEPLOY_USER}:${CI_DEPLOY_PASSWORD}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - git checkout $CI_COMMIT_REF_NAME
    # Аутентификация: сначала пробуем OIDC Trusted Publisher, затем fallback на обычный токен
    - |
      echo "📦 Версия npm: $(npm --version)"
      echo "📦 Версия node: $(node --version)"
      export NPM_CONFIG_REGISTRY=https://registry.npmjs.org
      
      # Пробуем OIDC Trusted Publisher (если настроен)
      if [ -n "$NPM_OIDC_TOKEN" ]; then
        echo "🔐 Пробуем использовать OIDC Trusted Publisher"
        # npm автоматически использует OIDC токен при наличии настроенного Trusted Publisher
        # Пока оставляем как есть, npm должен автоматически обнаружить токен
      fi
      
      # Fallback на обычный granular access token
      if [ -n "$NPM_TOKEN" ]; then
        echo "🔑 Используется granular access token (NPM_TOKEN)"
        npm config set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
        npm whoami || (echo "❌ npm whoami не прошел — токен невалиден или нет прав" && exit 1)
        echo "✅ Токен настроен для публикации"
      elif [ -z "$NPM_OIDC_TOKEN" ]; then
        echo "❌ Не настроена аутентификация npm"
        echo "Настройте либо OIDC Trusted Publisher, либо установите переменную NPM_TOKEN в GitLab CI/CD"
        exit 1
      else
        echo "ℹ️  Используется только OIDC Trusted Publisher (если настроен)"
      fi
    - chmod +x ./newVersion.sh
    - ./newVersion.sh
  when: manual
  only:
    - main
  after_script:
    - >
      if [ $CI_JOB_STATUS != 'success' ]; then
        sh ci-notify.sh "🆘 $CI_JOB_NAME failed"
      else
        sh ci-notify.sh "✅ $CI_JOB_NAME success"
      fi